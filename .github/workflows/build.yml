name: build
on:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1'   # weekly rebuild = fresh PHP/Alpine patches
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          tags: ghcr.io/${{ github.repository_owner }}/laravel-scim-server:latest
